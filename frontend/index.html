  <!-- Main React Application -->
  <script type="text/babel">
    const { useState, useEffect, useRef, useMemo } = React;

    // =========================================================================
    // 1. SEAMLESS DEMO LEDGER — INITIAL USERS & SYSTEM STATE
    // =========================================================================
    const initialUsers = {
      'senior@upi': {
        id: 'senior@upi',
        name: "Devraj Sharma (Senior)",
        accountNumber: "••• ••• 8492",
        balance: 50000.00,
        realBalance: 50000.00,
        ghostBalance: 1840.00,
        isDuressActive: false,
        password: "123",
        trustedGuardian: {
          name: "Priya Sharma",
          relation: "Daughter",
          phone: "+91 98402 11093",
          status: 'idle',
        },
        history: [
          {
            id: 'TXN-902184',
            type: 'RECEIVE',
            amount: 45000,
            from: 'SBI Senior Pension Fund',
            to: 'senior@upi',
            counterparty: 'SBI Senior Pension Fund',
            timestamp: '09:15 AM, Yesterday',
            status: 'COMPLETED',
            note: 'Monthly Senior Pension'
          },
          {
            id: 'TXN-872109',
            type: 'SEND',
            amount: 3200,
            from: 'senior@upi',
            to: 'Tata Power Electricity',
            counterparty: 'Tata Power Electricity',
            timestamp: '04:30 PM, 01 Sep',
            status: 'COMPLETED',
            note: 'Utility Bill Payment'
          }
        ]
      },
      'devraj@upi': {
        id: 'devraj@upi',
        name: "Devraj Sharma",
        accountNumber: "••• ••• 8492",
        balance: 845200.00,
        realBalance: 845200.00,
        ghostBalance: 1840.00,
        isDuressActive: false,
        password: "1234",
        trustedGuardian: {
          name: "Priya Sharma",
          relation: "Daughter",
          phone: "+91 98402 11093",
          status: 'idle',
        },
        history: []
      },
      'daughter@upi': {
        id: 'daughter@upi',
        name: "Priya Sharma (Daughter)",
        accountNumber: "••• ••• 4192",
        balance: 10000.00,
        realBalance: 10000.00,
        ghostBalance: 10000.00,
        isDuressActive: false,
        password: "abc",
        history: []
      },
      'scammer@upi': {
        id: 'scammer@upi',
        name: "Unverified Mule (Police Safe Vault)",
        accountNumber: "••• ••• 9901",
        balance: 0.00,
        realBalance: 0.00,
        ghostBalance: 0.00,
        isDuressActive: false,
        password: "000000",
        history: []
      }
    };

    const initialSentinelState = {
      users: initialUsers,
      currentUserId: 'senior@upi',
      threatTelemetry: {
        isCallActive: false,
        isScreenShareActive: false,
        coercionJitterScore: 18,
        clipboardThreatDetected: false,
        detectedKeywords: [],
      },
      activeEscrow: null,
      currentScreen: 'home', // 'home' | 'send_money' | 'escrow_view' | 'guardian_portal' | 'threat_matrix'
    };

    // Blacklist Patterns for Clipboard Quarantine
    const SCAM_KEYWORDS = [
      { word: 'CBI', label: 'Government Agency' },
      { word: 'Police', label: 'Law Enforcement' },
      { word: 'Arrest', label: 'Coercion / Threat' },
      { word: 'Customs', label: 'Customs Department' },
      { word: 'TRAI', label: 'Telecom Authority' },
      { word: 'Fine', label: 'Extortion Signal' },
      { word: 'Treasury', label: 'Holding Account' },
      { word: 'Suspension', label: 'Panic Indicator' },
      { word: 'Refund', label: 'Reverse PIN Vector' },
      { word: 'Cashback', label: 'Fraud Hook' },
      { word: 'KYC', label: 'Credential Phishing' }
    ];

    function App() {
      const [state, setState] = useState(initialSentinelState);
      
      // Active Input States for Send Money
      const [recipientVpa, setRecipientVpa] = useState('');
      const [transferAmount, setTransferAmount] = useState('15000');
      const [transferMemo, setTransferMemo] = useState('');
      const [enteredPin, setEnteredPin] = useState('');
      
      // UI Modals & Interaction States
      const [isPinModalOpen, setIsPinModalOpen] = useState(false);
      const [isAntiInversionModalOpen, setIsAntiInversionModalOpen] = useState(false);
      const [isSimulationDrawerOpen, setIsSimulationDrawerOpen] = useState(false);
      const [isScanningClipboard, setIsScanningClipboard] = useState(false);
      const [isProcessingGhostDelay, setIsProcessingGhostDelay] = useState(false);
      const [ghostTimeoutError, setGhostTimeoutError] = useState(null);
      const [reversalNotification, setReversalNotification] = useState(null);

      // Anti-Inversion 5-second countdown timer
      const [inversionTimer, setInversionTimer] = useState(5);
      const [hasAcknowledgedInversion, setHasAcknowledgedInversion] = useState(false);

      // Current User Pointer & Active Balance
      const currentUser = state.users[state.currentUserId] || state.users['devraj@upi'];
      const currentBalance = currentUser.isDuressActive ? currentUser.ghostBalance : currentUser.realBalance;

      // =========================================================================
      // 2. DOUBLE-ENTRY ACCOUNTING & DYNAMIC ACCOUNT GENERATION
      // =========================================================================
      const processTransfer = (paramA, paramB, note = '', isEscrow = false) => {
        let recipientId = paramA;
        let amount = paramB;
        if (typeof paramA === 'number' || (!isNaN(parseFloat(paramA)) && isNaN(parseFloat(paramB)))) {
          amount = paramA;
          recipientId = paramB;
        }

        const cleanRecipientId = (recipientId || 'unknown@upi').trim().toLowerCase();
        const numAmount = parseFloat(amount) || 0;
        const timestamp = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' }) + ', Today';
        const txId = `TXN-${Math.floor(100000 + Math.random() * 900000)}`;

        setState(prev => {
          const sender = prev.users[prev.currentUserId];
          if (!sender) return prev;

          // Block if insufficient funds
          if (sender.balance < numAmount) {
            alert("Insufficient funds in account.");
            return prev;
          }

          const newUsers = { ...prev.users };

          // DYNAMIC ACCOUNT GENERATION (THE DEMO HACK)
          // If recipient does not exist in our ledger, generate their profile dynamically!
          if (!newUsers[cleanRecipientId]) {
            const handlePart = cleanRecipientId.split('@')[0].replace(/[._-]/g, ' ');
            const cleanName = handlePart.charAt(0).toUpperCase() + handlePart.slice(1) + " (Payee)";
            const randAcc = `••• ••• ${Math.floor(1000 + Math.random() * 9000)}`;

            newUsers[cleanRecipientId] = {
              id: cleanRecipientId,
              name: cleanName,
              accountNumber: randAcc,
              balance: 0,
              realBalance: 0,
              ghostBalance: 0,
              isDuressActive: false,
              password: "000000",
              history: [],
              transactionHistory: []
            };
          }

          if (isEscrow) {
            // Funds buffered in Escrow: deduct from sender, hold pending release
            const escrowRecord = {
              id: txId,
              type: 'SEND',
              amount: numAmount,
              to: cleanRecipientId,
              counterparty: newUsers[cleanRecipientId]?.name || cleanRecipientId,
              timestamp: timestamp,
              status: 'ESCROW_HOLDING',
              note: note || 'Safe Escrow Buffered'
            };

            const senderUpdatedHistory = [escrowRecord, ...(sender.history || [])];

            newUsers[prev.currentUserId] = {
              ...sender,
              balance: sender.balance - numAmount,
              realBalance: sender.realBalance - numAmount,
              history: senderUpdatedHistory,
              transactionHistory: senderUpdatedHistory
            };

            const newEscrow = {
              id: txId,
              amount: numAmount,
              beneficiary: newUsers[cleanRecipientId]?.name || cleanRecipientId,
              recipientVpa: cleanRecipientId,
              remainingSeconds: 1799,
              status: 'holding'
            };

            return {
              ...prev,
              users: newUsers,
              activeEscrow: newEscrow,
              currentScreen: 'escrow_view'
            };
          } else {
            // DIRECT INSTANT TRANSFER: DOUBLE-ENTRY DEBIT & CREDIT
            const senderDebit = {
              id: txId,
              type: 'SEND',
              amount: numAmount,
              to: cleanRecipientId,
              counterparty: newUsers[cleanRecipientId]?.name || cleanRecipientId,
              timestamp: timestamp,
              status: 'COMPLETED',
              note: note || 'Instant UPI Transfer'
            };

            const recipientCredit = {
              id: txId,
              type: 'RECEIVE',
              amount: numAmount,
              from: sender.id,
              counterparty: sender.name,
              timestamp: timestamp,
              status: 'COMPLETED',
              note: note || 'Received via SENTINEL'
            };

            const senderUpdatedHistory = [senderDebit, ...(sender.history || [])];
            newUsers[prev.currentUserId] = {
              ...sender,
              balance: sender.balance - numAmount,
              realBalance: sender.realBalance - numAmount,
              history: senderUpdatedHistory,
              transactionHistory: senderUpdatedHistory
            };

            const recipient = newUsers[cleanRecipientId];
            const recipientUpdatedHistory = [recipientCredit, ...(recipient.history || [])];
            newUsers[cleanRecipientId] = {
              ...recipient,
              balance: recipient.balance + numAmount,
              realBalance: recipient.realBalance + numAmount,
              history: recipientUpdatedHistory,
              transactionHistory: recipientUpdatedHistory
            };

            return {
              ...prev,
              users: newUsers,
              currentScreen: 'home'
            };
          }
        });
      };

      // =========================================================================
      // ESCROW REAL-TIME COUNTDOWN & AUTO-RELEASE EFFECT
      // =========================================================================
      useEffect(() => {
        if (!state.activeEscrow || state.activeEscrow.status !== 'holding') return;

        const interval = setInterval(() => {
          setState(prev => {
            if (!prev.activeEscrow || prev.activeEscrow.remainingSeconds <= 1) {
              // Escrow expired / completed: Credit the recipient account in ledger!
              const escrow = prev.activeEscrow;
              const recId = escrow.recipientVpa;
              const newUsers = { ...prev.users };
              if (newUsers[recId]) {
                newUsers[recId] = {
                  ...newUsers[recId],
                  realBalance: newUsers[recId].realBalance + escrow.amount,
                  transactionHistory: [
                    {
                      id: escrow.id,
                      type: 'RECEIVE',
                      amount: escrow.amount,
                      counterparty: newUsers[prev.currentUserId]?.name || 'Sender',
                      timestamp: 'Escrow Released, Today',
                      status: 'COMPLETED',
                      note: 'Escrow buffer cleared'
                    },
                    ...(newUsers[recId].transactionHistory || [])
                  ]
                };
              }
              return {
                ...prev,
                users: newUsers,
                activeEscrow: prev.activeEscrow ? { ...prev.activeEscrow, remainingSeconds: 0, status: 'released' } : null
              };
            }
            return {
              ...prev,
              activeEscrow: {
                ...prev.activeEscrow,
                remainingSeconds: prev.activeEscrow.remainingSeconds - 1
              }
            };
          });
        }, 1000);

        return () => clearInterval(interval);
      }, [state.activeEscrow?.status]);

      // Anti-Inversion Modal Countdown timer effect
      useEffect(() => {
        if (!isAntiInversionModalOpen) {
          setInversionTimer(5);
          setHasAcknowledgedInversion(false);
          return;
        }

        if (inversionTimer > 0) {
          const timer = setTimeout(() => setInversionTimer(t => t - 1), 1000);
          return () => clearTimeout(timer);
        }
      }, [isAntiInversionModalOpen, inversionTimer]);

      // Threat Beacon Ambient Glow Calculation
      const beaconStatus = useMemo(() => {
        if (currentUser.isDuressActive) {
          return {
            color: 'crimson',
            label: 'Duress Protocol Engaged',
            subtext: 'Shadow ledger streaming; guardian alerted',
            classes: 'animate-pulse-glow-crimson border-red-500/40 bg-red-950/40 text-red-400'
          };
        }
        if (state.threatTelemetry.isCallActive || state.threatTelemetry.isScreenShareActive || state.threatTelemetry.clipboardThreatDetected) {
          return {
            color: 'amber',
            label: 'High-Caution Context Detected',
            subtext: state.threatTelemetry.isCallActive ? 'Active phone call in progress' : 'Remote screen sharing detected',
            classes: 'animate-pulse-glow-amber border-amber-500/40 bg-amber-950/40 text-amber-400'
          };
        }
        return {
          color: 'emerald',
          label: 'Sentinel Guard Active',
          subtext: 'Heuristics & Escrow Buffers Nominal',
          classes: 'animate-pulse-glow-emerald border-emerald-500/40 bg-emerald-950/40 text-emerald-400'
        };
      }, [currentUser.isDuressActive, state.threatTelemetry]);

      // Clipboard threat scanner
      const handlePasteRecipient = (textToPaste) => {
        setIsScanningClipboard(true);
        setRecipientVpa(textToPaste);

        setTimeout(() => {
          setIsScanningClipboard(false);
          const found = [];
          SCAM_KEYWORDS.forEach(k => {
            const regex = new RegExp(`\\b${k.word}\\b`, 'i');
            if (regex.test(textToPaste) || regex.test(transferMemo)) {
              found.push(k.word);
            }
          });

          if (found.length > 0) {
            setState(prev => ({
              ...prev,
              threatTelemetry: {
                ...prev.threatTelemetry,
                clipboardThreatDetected: true,
                detectedKeywords: found
              }
            }));
          }
        }, 1200);
      };

      // Initiate payment evaluation
      const handleInitiateTransfer = () => {
        const amount = parseFloat(transferAmount) || 0;
        const combinedText = `${recipientVpa} ${transferMemo}`.toLowerCase();

        // Anti-Inversion Check: "PIN to Receive / Refund"
        const hasRefundKeyword = /refund|cashback|win|claim|kyc|bonus|pension/.test(combinedText);
        if (hasRefundKeyword || combinedText.includes('refund')) {
          setIsAntiInversionModalOpen(true);
          return;
        }

        // Open PIN Entry Modal
        setIsPinModalOpen(true);
      };

      // Execute PIN Entry
      const handlePinSubmit = (pin) => {
        setIsPinModalOpen(false);
        const amount = parseFloat(transferAmount) || 0;

        // GHOST MODE TRIGGER (PIN 9999 or user duress active)
        if (pin === '9999' || currentUser.isDuressActive) {
          setIsProcessingGhostDelay(true);

          setTimeout(() => {
            setIsProcessingGhostDelay(false);
            setGhostTimeoutError({
              title: "Error 504: Core Banking Gateway Unreachable",
              message: "Interbank transaction timeout during cryptographic verification. Please try again after 2 hours. No funds were debited.",
            });

            // Silently engage duress state on active user
            setState(prev => {
              const u = prev.users[prev.currentUserId];
              return {
                ...prev,
                users: {
                  ...prev.users,
                  [prev.currentUserId]: {
                    ...u,
                    isDuressActive: true,
                    trustedGuardian: u.trustedGuardian ? { ...u.trustedGuardian, status: 'notified' } : undefined
                  }
                },
                threatTelemetry: {
                  ...prev.threatTelemetry,
                  coercionJitterScore: 94
                }
              };
            });
          }, 4000);

          return;
        }

        // REAL EXECUTION (MASTER PIN 1234 or new user 000000)
        const isHighValue = amount >= 10000;
        const isSuspiciousTelemetry = state.threatTelemetry.isCallActive || state.threatTelemetry.isScreenShareActive || state.threatTelemetry.clipboardThreatDetected;

        if (isHighValue || isSuspiciousTelemetry) {
          // Send to Escrow with dynamic double-entry tracking
          processTransfer(amount, recipientVpa, transferMemo, true);
        } else {
          // Instant direct double-entry transfer
          processTransfer(amount, recipientVpa, transferMemo, false);
          alert(`Transfer of ₹${amount.toLocaleString('en-IN')} completed successfully.`);
        }
      };

      // Escrow Instant Reversal
      const handleCancelEscrow = () => {
        if (!state.activeEscrow) return;
        const refundAmount = state.activeEscrow.amount;
        const escrowId = state.activeEscrow.id;

        setState(prev => {
          const sender = prev.users[prev.currentUserId];
          const newUsers = { ...prev.users };

          if (sender) {
            const updatedHistory = (sender.transactionHistory || []).map(tx => {
              if (tx.id === escrowId) {
                return { ...tx, status: 'REVERSED', note: 'Cancelled & Immediately Refunded' };
              }
              return tx;
            });

            newUsers[prev.currentUserId] = {
              ...sender,
              realBalance: sender.realBalance + refundAmount,
              trustedGuardian: sender.trustedGuardian ? { ...sender.trustedGuardian, status: 'rejected' } : undefined,
              transactionHistory: updatedHistory
            };
          }

          return {
            ...prev,
            users: newUsers,
            activeEscrow: null,
            currentScreen: 'home'
          };
        });

        setReversalNotification({
          amount: refundAmount,
          refId: escrowId
        });
      };

      // Format currency
      const formatINR = (num) => {
        return new Intl.NumberFormat('en-IN', {
          style: 'currency',
          currency: 'INR',
          maximumFractionDigits: 2
        }).format(num || 0);
      };

      // Format Escrow MM:SS
      const formatTime = (secs) => {
        const m = Math.floor(secs / 60);
        const s = secs % 60;
        return `${m.toString().padStart(2, '0')}:${s.toString().padStart(2, '0')}`;
      };

      return (
        <div className="min-h-screen bg-navy-900 text-slate-100 flex flex-col items-center p-3 sm:p-6 relative selection:bg-blue-600 selection:text-white">

          {/* ========================================================================= */}
          {/* FLOATING DEMO SIMULATION DRAWER (WITH USER CONTEXT SWITCHER) */}
          {/* ========================================================================= */}
          <div className="fixed top-4 right-4 z-50">
            <button
              onClick={() => setIsSimulationDrawerOpen(prev => !prev)}
              className="flex items-center gap-2 px-3.5 py-2 rounded-full glass-panel text-xs font-semibold tracking-wide border border-blue-500/30 text-blue-300 hover:text-white hover:bg-blue-900/40 hover:brightness-110 active:scale-95 transition-all duration-150 ease-out shadow-lg hover:shadow-blue-500/20"
            >
              <span className="w-2.5 h-2.5 rounded-full bg-blue-400 animate-ping"></span>
              <span>Demo Scenario Drawer</span>
              <svg className={`w-3.5 h-3.5 transition-transform duration-150 ${isSimulationDrawerOpen ? 'rotate-180' : ''}`} fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2.5" d="M19 9l-7 7-7-7" />
              </svg>
            </button>

            {isSimulationDrawerOpen && (
              <div className="absolute right-0 mt-2 w-80 sm:w-96 glass-modal border border-white/10 rounded-2xl p-5 shadow-2xl animate-in fade-in zoom-in-95 duration-200">
                <div className="flex items-center justify-between pb-3 border-b border-white/10">
                  <div className="flex items-center gap-2">
                    <svg className="w-4 h-4 text-blue-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4" />
                    </svg>
                    <h4 className="text-sm font-bold text-white tracking-wide">Live Hackathon Controls</h4>
                  </div>
                  <span className="text-[10px] px-2 py-0.5 rounded bg-blue-500/20 text-blue-300 font-mono">1-CLICK TEST</span>
                </div>

                <div className="mt-4 space-y-3 text-xs">

                  {/* USER CONTEXT SWITCHER (THE DEMO HACK) */}
                  <div className="p-3 rounded-xl bg-blue-950/40 border border-blue-500/30 space-y-2">
                    <div className="flex items-center justify-between">
                      <div className="font-bold text-blue-200">Active User Context (Demo Switcher)</div>

                <div className="flex justify-center gap-4 py-2">
                  {[0, 1, 2, 3].map(index => (
                    <div
                      key={index}
                      className={`w-11 h-11 rounded-xl border-2 flex items-center justify-center text-lg font-bold font-mono transition-all ${enteredPin.length > index ? 'border-blue-500 bg-blue-500/20 text-white' : 'border-white/20 bg-white/5 text-transparent'}`}
                    >
                      {enteredPin.length > index ? '•' : ''}
                    </div>
                  ))}
                </div>

                {/* TACTILE NUMERAL KEYPAD: SQUISH & SPRING (active:scale-95 duration-150) */}
                <div className="grid grid-cols-3 gap-2 pt-2">
                  {[1, 2, 3, 4, 5, 6, 7, 8, 9].map(num => (
                    <button
                      key={num}
                      onClick={() => {
                        if (enteredPin.length < 4) {
                          const newPin = enteredPin + num;
                          setEnteredPin(newPin);
                          if (newPin.length === 4) {
                            setTimeout(() => {
                              handlePinSubmit(newPin);
                              setEnteredPin('');
                            }, 200);
                          }
                        }
                      }}
                      className="py-3.5 rounded-xl glass-panel text-lg font-bold text-white hover:brightness-110 hover:bg-white/15 active:scale-95 transition-all duration-150 ease-out shadow-sm"
                    >
                      {num}
                    </button>
                  ))}
                  <button
                    onClick={() => setEnteredPin('')}
                    className="py-3.5 rounded-xl glass-panel text-xs font-semibold text-slate-400 hover:text-white hover:brightness-110 active:scale-95 transition-all duration-150 ease-out"
                  >
                    Clear
                  </button>
                  <button
                    onClick={() => {
                      if (enteredPin.length < 4) {
                        const newPin = enteredPin + '0';
                        setEnteredPin(newPin);
                        if (newPin.length === 4) {
                          setTimeout(() => {
                            handlePinSubmit(newPin);
                            setEnteredPin('');
                          }, 200);
                        }
                      }
                    }}
                    className="py-3.5 rounded-xl glass-panel text-lg font-bold text-white hover:brightness-110 hover:bg-white/15 active:scale-95 transition-all duration-150 ease-out shadow-sm"
                  >
                    0
                  </button>
                  <button
                    onClick={() => setEnteredPin(prev => prev.slice(0, -1))}
                    className="py-3.5 rounded-xl glass-panel text-sm font-semibold text-slate-400 hover:text-white hover:brightness-110 active:scale-95 transition-all duration-150 ease-out flex items-center justify-center"
                  >
                    ⌫
                  </button>
                </div>

                <div className="text-[11px] text-center text-slate-400">
                  Demo hint: Use <strong>1234</strong> (Master) or <strong>9999</strong> (Duress Shadow PIN)
                </div>
              </div>
            </div>
          )}

          {/* ========================================================================= */}
          {/* GHOST MODE 4-SECOND SIMULATED SPINNER & TIMEOUT ERROR DIALOG */}
          {/* ========================================================================= */}
          {isProcessingGhostDelay && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-sm rounded-3xl bg-navy-900 border border-white/10 p-8 text-center space-y-4 animate-in fade-in duration-200">
                <div className="w-12 h-12 border-3 border-blue-500 border-t-transparent rounded-full animate-spin mx-auto"></div>
                <div className="text-base font-bold text-white">Cryptographic Security Handshake...</div>
                <p className="text-xs text-slate-400">Verifying multi-point banking tokens with core gateway.</p>
              </div>
            </div>
          )}

          {ghostTimeoutError && (
            <div className="fixed inset-0 bg-black/85 backdrop-blur-md z-50 flex items-center justify-center p-4">
              <div className="w-full max-w-md rounded-3xl bg-navy-900 border border-white/15 p-6 space-y-4 shadow-2xl animate-in zoom-in-95 duration-200">
                <div className="w-12 h-12 rounded-full bg-slate-800 text-slate-300 flex items-center justify-center mx-auto">
                  <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
                  </svg>
                </div>
                <div className="text-center space-y-1">
                  <h3 className="text-lg font-bold text-white">{ghostTimeoutError.title}</h3>
                  <p className="text-xs text-slate-300 leading-relaxed">{ghostTimeoutError.message}</p>
                </div>
                <button
                  onClick={() => setGhostTimeoutError(null)}
                  className="w-full py-3 rounded-xl bg-slate-800 hover:bg-slate-700 hover:brightness-110 active:scale-95 text-white text-xs font-bold transition-all duration-150 ease-out"
                >
                  Dismiss
                </button>
              </div>
            </div>
          )}

        </div>
      );
    }

    // Render the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
